<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AuraCalc - A sleek, modern, glassmorphic calculator with calculation history, audio feedback, scientific quick-keys, and full keyboard support.">
  <title>AuraCalc — Modern Glassmorphic Calculator</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow orbs -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="app-container" id="calculator-app">
    <div class="calculator-card glass-panel" id="calculator-card">
      <!-- Calculator Header -->
      <header class="calc-header">
        <div class="brand">
          <div class="brand-badge">
            <span class="brand-dot"></span>
            <span class="brand-title">AuraCalc</span>
          </div>
        </div>
        <div class="header-controls">
          <button type="button" class="icon-btn" id="btn-sound-toggle" title="Toggle Sound Feedback (Click/Audio)" aria-label="Toggle Sound">
            <span class="icon" id="sound-icon">🔊</span>
          </button>
          <button type="button" class="icon-btn" id="btn-history-toggle" title="Toggle Calculation History" aria-label="Toggle History">
            <span class="icon">📜</span>
            <span class="badge" id="history-badge" style="display: none;">0</span>
          </button>
          <button type="button" class="icon-btn" id="btn-theme-toggle" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
            <span class="icon" id="theme-icon">🌙</span>
          </button>
        </div>
      </header>

      <!-- Calculator Display -->
      <section class="display-container" aria-label="Calculator Screen">
        <div class="expression-line" id="expression-display" aria-live="polite"></div>
        <div class="main-display-wrapper">
          <span class="display-value" id="main-display" role="status" aria-live="polite">0</span>
          <button type="button" class="copy-btn" id="btn-copy" title="Copy result to clipboard" aria-label="Copy Result">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </section>

      <!-- Mini Scientific / Quick Functions Bar -->
      <section class="quick-functions" aria-label="Quick Math Functions">
        <button type="button" class="func-btn" data-action="sqrt" id="btn-sqrt" title="Square Root">√x</button>
        <button type="button" class="func-btn" data-action="square" id="btn-square" title="Square (x²)">x²</button>
        <button type="button" class="func-btn" data-action="reciprocal" id="btn-reciprocal" title="Reciprocal (1/x)">1/x</button>
        <button type="button" class="func-btn" data-action="pi" id="btn-pi" title="Pi (π)">π</button>
      </section>

      <!-- Main Keypad Grid -->
      <section class="keypad" aria-label="Calculator Keypad">
        <!-- Row 1 -->
        <button type="button" class="btn btn-action" data-action="clear" id="btn-clear">AC</button>
        <button type="button" class="btn btn-action" data-action="delete" id="btn-backspace" title="Backspace (⌫)">⌫</button>
        <button type="button" class="btn btn-action" data-action="percent" id="btn-percent">%</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-operator="/" id="btn-divide" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button type="button" class="btn btn-number" data-action="number" data-value="7" id="btn-7">7</button>
        <button type="button" class="btn btn-number" data-action="number" data-value="8" id="btn-8">8</button>
        <button type="button" class="btn btn-number" data-action="number" data-value="9" id="btn-9">9</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-operator="*" id="btn-multiply" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button type="button" class="btn btn-number" data-action="number" data-value="4" id="btn-4">4</button>
        <button type="button" class="btn btn-number" data-action="number" data-value="5" id="btn-5">5</button>
        <button type="button" class="btn btn-number" data-action="number" data-value="6" id="btn-6">6</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-operator="-" id="btn-subtract" aria-label="Minus">−</button>

        <!-- Row 4 -->
        <button type="button" class="btn btn-number" data-action="number" data-value="1" id="btn-1">1</button>
        <button type="button" class="btn btn-number" data-action="number" data-value="2" id="btn-2">2</button>
        <button type="button" class="btn btn-number" data-action="number" data-value="3" id="btn-3">3</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-operator="+" id="btn-add" aria-label="Plus">+</button>

        <!-- Row 5 -->
        <button type="button" class="btn btn-number" data-action="negate" id="btn-negate">±</button>
        <button type="button" class="btn btn-number" data-action="number" data-value="0" id="btn-0">0</button>
        <button type="button" class="btn btn-number" data-action="decimal" id="btn-decimal">.</button>
        <button type="button" class="btn btn-equals" data-action="calculate" id="btn-equals" aria-label="Equals">=</button>
      </section>

      <!-- History Drawer Overlay -->
      <aside class="history-drawer" id="history-drawer" aria-label="Calculation History" aria-hidden="true">
        <div class="history-header">
          <div class="history-title">
            <span>Past Calculations</span>
          </div>
          <div class="history-actions">
            <button type="button" class="history-clear-btn" id="btn-clear-history" title="Clear all history">Clear</button>
            <button type="button" class="icon-btn close-drawer-btn" id="btn-close-history" aria-label="Close History">✕</button>
          </div>
        </div>
        <div class="history-list" id="history-list">
          <div class="empty-history-msg">No calculations yet</div>
        </div>
      </aside>

      <!-- Toast Notification for Copy/Feedback -->
      <div class="toast" id="calc-toast" role="alert" aria-live="assertive"></div>
    </div>

    <!-- Keyboard Shortcuts Hint Footer -->
    <footer class="app-footer">
      <p class="keyboard-hint">
        <span class="kbd">0-9</span> Numbers &bull; 
        <span class="kbd">+ - * /</span> Operators &bull; 
        <span class="kbd">Enter</span> Equals &bull; 
        <span class="kbd">Esc</span> Clear &bull; 
        <span class="kbd">Backspace</span> Delete
      </p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
